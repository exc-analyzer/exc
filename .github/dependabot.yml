version: 2
updates:
  # Action'lar commit SHA'ya sabitli. Dependabot bunlari haftalik gozden gecirip
  # yeni SHA icin PR acar; boylece hem sabitleme korunur hem guncel kalinir.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
