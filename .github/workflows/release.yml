name: Publish Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI Trusted Publishing icin OIDC token - uzun omurlu API token kullanilmiyor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build
          
      - name: Build package
        run: python -m build
        
      - name: Publish to PyPI (Trusted Publishing - API token yok)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # Ayni surum zaten yayindaysa hata verme, atla. Release elle
          # yayinlanirsa is ikinci kez tetiklenebilir; bu onu zararsiz kilar.
          skip-existing: true

  build-debian:
    name: Build & Upload Debian Package
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for uploading assets to release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Debian Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-python python3-all python3-setuptools python3-wheel python3-build pybuild-plugin-pyproject fakeroot
          
      - name: Build Debian Package
        run: |
          # Build the package using standard Debian tools
          dpkg-buildpackage -us -uc -b
          
          # Move the generated .deb file to a clean directory for upload
          mkdir -p dist-deb
          mv ../*.deb dist-deb/
          
          echo "DEB_FILE=$(ls dist-deb/*.deb)" >> $GITHUB_ENV
          
      - name: Upload .deb to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-deb/*.deb
          body: |
            # EXC Analyzer Release
            
            ## 🛡️ Security & Privacy
            - **Transparent Scopes:** Completely revised README to transparently list all requested permissions (`repo`, `workflow`) and their specific necessity.
            - **Enhanced Log Security:** Expanded log masking to protect all GitHub token types (`ghp_`, `gho_`, `github_pat_`, etc.).
            - **Passive Analysis Guarantee:** Explicitly documented that the tool operates in a read-only manner despite write-capable scopes.
            
            ## ⚡ Stability & Performance
            - **Network Timeouts:** Added global timeout protection to prevent hanging on unresponsive network requests during scans.
            - **Dependency Cleanup:** Removed unused `toml` and `tabulate` dependencies for a lighter footprint.
            
            ## ✨ Improvements
            - **Overwrite Protection:** `dork-scan --export` now asks for confirmation before overwriting existing files.
            - **Documentation:** Added clear "Risk Disclaimer" and access revocation instructions.
            
            ## 📦 Installation
            
            ### PyPI (Windows/Linux/macOS)
            ```bash
            pip install exc-analyzer
            ```
            
            ### Debian/Kali Linux
            ```bash
            sudo dpkg -i exc-analyzer_*_all.deb
            sudo apt-get install -f
            ```
            
            ## 🔗 Links
            
            - [PyPI Package](https://pypi.org/project/exc-analyzer/)
            - [Documentation](https://github.com/exc-analyzer/exc#readme)
            - [Report Issues](https://github.com/exc-analyzer/exc/issues)
