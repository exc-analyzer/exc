name: Publish Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI Trusted Publishing icin OIDC token - uzun omurlu API token kullanilmiyor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build
          
      - name: Build package
        run: python -m build
        
      - name: Publish to PyPI (Trusted Publishing - API token yok)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # Ayni surum zaten yayindaysa hata verme, atla. Release elle
          # yayinlanirsa is ikinci kez tetiklenebilir; bu onu zararsiz kilar.
          skip-existing: true

  build-debian:
    name: Build & Upload Debian Package
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for uploading assets to release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Debian Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-python python3-all python3-setuptools python3-wheel python3-build pybuild-plugin-pyproject fakeroot
          
      - name: Build Debian Package
        run: |
          # Build the package using standard Debian tools
          dpkg-buildpackage -us -uc -b
          
          # Move the generated .deb file to a clean directory for upload
          mkdir -p dist-deb
          mv ../*.deb dist-deb/
          
          echo "DEB_FILE=$(ls dist-deb/*.deb)" >> $GITHUB_ENV
          
      - name: Upload .deb to Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-deb/*.deb
          body: |
            # EXC Analyzer Release
            
            ## 🛡️ Security & Privacy
            - **Keyring-Only Credentials:** Token storage now requires OS credential vault support (no local/plaintext fallback).
            - **Secure Migration Path:** Legacy local token artifacts are migrated to keyring and cleaned up safely.
            - **Hardened Error Paths:** Critical auth and storage failures now fail fast with clear guidance.
            
            ## ⚡ Stability & Performance
            - **Proactive Low-Quota Guard:** REST and GraphQL requests slow down intelligently when quota is critically low.
            - **GraphQL Efficiency:** Added short TTL query cache and cost/remaining/reset telemetry tracking.
            - **Adaptive Fetching:** Async pagination now adjusts request windows based on available quota.
            
            ## ✨ Improvements
            - **Unified Network Layer:** `dork-scan` and `content-audit` now use shared safe HTTP helpers for consistent timeout/cache handling.
            - **Verbose Rate Diagnostics:** Added optional wait telemetry to explain proactive throttling decisions.
            - **Maintenance Cleanup:** Broad quality pass across exceptions, lint issues, and command reliability.
            
            ## 📦 Installation
            
            ### PyPI (Windows/Linux/macOS)
            ```bash
            pip install exc-analyzer
            ```
            
            ### Debian/Kali Linux
            ```bash
            sudo dpkg -i exc-analyzer_*_all.deb
            sudo apt-get install -f
            ```
            
            ## 🔗 Links
            
            - [PyPI Package](https://pypi.org/project/exc-analyzer/)
            - [Documentation](https://github.com/exc-analyzer/exc#readme)
            - [Report Issues](https://github.com/exc-analyzer/exc/issues)
